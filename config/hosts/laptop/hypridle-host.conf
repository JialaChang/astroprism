# Deployed to ~/.config/hypr/hypridle.conf by deploy_host.

general {
    lock_cmd = ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = ~/.config/hypr/scripts/presleep.sh
    # Replaces the hyprlock that spanned suspend; a stale one takes no input.
    after_sleep_cmd = ~/.config/waybar/scripts/charge-limit.sh restore; ~/.config/hypr/scripts/relock.sh
    ignore_dbus_inhibit = false
}

# -s saves the current level so -r can restore it on activity.
listener {
    timeout = 180
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
