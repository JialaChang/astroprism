# Deployed to ~/.config/hypr/hyprlock-host.conf by deploy_host.
# eDP-1 runs at scale 2, so these are logical pixels.

$font_clock = 200
$font_date = 20
$font_user = 22
$font_player = 18
$font_status = 20

# Vertical stack, all centered: clock, date, avatar, name, input.
$clock_y = 269
$date_y = 115

$avatar_size = 170
$avatar_y = -90
$user_y = -214

$input_width = 340
$input_height = 58
$input_y = -300

$capslock_y = -370
