"$schema" = 'https://starship.rs/config-schema.json'

format = '''
[󰣇 ](fg:matugen-color3)$username[ ](fg:matugen-color3)$directory[ ](fg:matugen-color1)$git_branch$git_status $nodejs$rust$golang$php$python$lua $cmd_duration$jobs$line_break$character'''

palette = 'colors'

[palettes.colors]
mustard = '#af8700'
matugen-color1 = '#a2c9fe'
matugen-color2 = '#00325a'
matugen-color3 = '#c3c6cf'
matugen-color4 = '#1d2024'
matugen-color5 = '#00325a'
matugen-color6 = '#00325a'
matugen-color7 = '#111418'
matugen-color8 = '#a2c9fe'
matugen-color9 = '#d8bde4'
matugen-color10 = '#001c37'
matugen-color11 = '#1d4875'
matugen-color12 = '#263141'

[username]
show_always = true
style_user = "fg:matugen-color3 bold"
style_root = "fg:matugen-color8 bold"
format = "[ $user]($style)"
disabled = false

[directory]
style = "fg:matugen-color1 bold"
format = "[ 󰉋 $path]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = "󰇚"
"Music" = ""
"Pictures" = ""
"Coding" = "󰨞"

[git_branch]
symbol = ""
format = '[ $symbol $branch](fg:matugen-color9)'

[git_status]
format = '[($all_status$ahead_behind)](fg:matugen-color9)'

[nodejs]
symbol = ""
format = '[ $symbol ($version)](fg:matugen-color3)'

[rust]
symbol = ""
format = '[ $symbol ($version)](fg:matugen-color3)'

[golang]
symbol = "󰟓"
format = '[ $symbol ($version)](fg:matugen-color3)'

[php]
symbol = ""
format = '[ $symbol ($version)](fg:matugen-color3)'

[python]
symbol = ""
format = '[ $symbol ($version)( \($virtualenv\))](fg:matugen-color3)'

[lua]
symbol = ""
format = '[ $symbol ($version)](fg:matugen-color3)'

[cmd_duration]
min_time = 2000
format = '[ 󱎫 $duration](fg:matugen-color9)'

[jobs]
symbol = ""
number_threshold = 1
format = '[ $symbol $number](fg:matugen-color9)'

[time]
disabled = false
time_format = "%R"
format = '[  $time](fg:matugen-color3)'

[character]
success_symbol = "[❯](fg:matugen-color1 bold)"
error_symbol = "[❯](fg:matugen-color8 bold)"
