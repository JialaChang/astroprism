# Generated by matugen from config/matugen/templates/hyprlock-colors.conf.
source = $HOME/.config/hypr/colors/hyprlock.conf

# Written by deploy_host from config/hosts/<profile>/hyprlock-host.conf.
source = $HOME/.config/hypr/hyprlock-host.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.012
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.18
}

# --- now playing ---

# In a script because playerctl's {{title}} collides with hyprlang's own {{ }}.
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/nowplaying.sh
    color = $on_surface_variant
    font_size = $font_player
    font_family = JetBrains Nerd Font Bold
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
    position = 32, 28
    halign = left
    valign = bottom
}

# --- clock + date ---

# Text sits straight on the blurred wallpaper, so every label carries a shadow
# rather than a panel behind it.
label {
    monitor =
    # Real spaces, not letter_spacing: hyprgraphics renders with
    # pango_layout_set_text, so span attributes never apply.
    text = cmd[update:1000] date +"%H : %M"
    color = $on_surface
    font_size = $font_clock
    font_family = JetBrains Nerd Font ExtraBold
    shadow_passes = 3
    shadow_size = 5
    shadow_color = $shadow
    shadow_boost = 1.2
    position = 0, $clock_y
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $on_surface_variant
    font_size = $font_date
    font_family = JetBrains Nerd Font Medium
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
    position = 0, $date_y
    halign = center
    valign = center
}

# --- avatar + user ---

# Skipped silently when ~/.face doesn't exist.
image {
    monitor =
    path = $HOME/.face
    size = $avatar_size
    border_size = 2
    border_color = $accent
    rounding = -1
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow
    position = 0, $avatar_y
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $on_surface_variant
    font_size = $font_user
    font_family = JetBrains Nerd Font Medium
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
    position = 0, $user_y
    halign = center
    valign = center
}

# --- input field ---

input-field {
    monitor =
    size = $input_width, $input_height
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    rounding = 12
    outer_color = $accent
    inner_color = $input_fill
    font_color = $on_surface
    check_color = $tertiary
    fail_color = $error
    capslock_color = $secondary
    placeholder_text = <i>Enter password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow
    position = 0, $input_y
    halign = center
    valign = center
}

# --- status ---

# Empty on machines with no battery, so this needs no per-host switch.
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/battery.sh
    color = $on_surface_variant
    font_size = $font_status
    font_family = JetBrains Nerd Font Bold
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
    position = -32, 28
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:500] ~/.config/hypr/scripts/capslock.sh
    color = $error
    font_size = $font_status
    font_family = JetBrains Nerd Font Bold
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
    position = 0, $capslock_y
    halign = center
    valign = center
}
