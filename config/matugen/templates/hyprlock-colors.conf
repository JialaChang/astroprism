# matugen-generated; regenerated on every wallset run. Do not edit.
# Source of truth: config/matugen/templates/hyprlock-colors.conf
# Sourced by ~/.config/hypr/hyprlock.conf, which uses these as $variables.

$accent = rgb({{colors.primary.default.hex_stripped}})
$secondary = rgb({{colors.secondary.default.hex_stripped}})
$tertiary = rgb({{colors.tertiary.default.hex_stripped}})

$on_surface = rgb({{colors.on_surface.default.hex_stripped}})
$on_surface_variant = rgb({{colors.on_surface_variant.default.hex_stripped}})
$error = rgb({{colors.error.default.hex_stripped}})

# Trailing 2 hex digits are alpha; matugen's .hex_stripped emits rrggbb only.
# The input field is the only filled surface, and it stays translucent so the
# wallpaper reads through it.
$input_fill = rgba({{colors.surface_container.default.hex_stripped}}b3)
$shadow = rgba({{colors.scrim.default.hex_stripped}}a6)
