# matugen-generated; regenerated on every wallset run. Do not edit.
# Source of truth: config/matugen/templates/hyprexpose-colors.toml

[appearance]
font = "JetBrains Nerd Font Bold 11"
label_font = "JetBrains Nerd Font Bold 13"

# 12px radius and 24px gaps match waybar's module styling.
card_radius = 12.0
card_padding = 24.0

max_card_width = 480.0
max_card_height = 320.0
label_height = 32.0
thumb_padding = 8.0
select_border = 3.0

[colors]
# Trailing 2 hex digits are alpha; matugen's .hex emits #rrggbb only.
background = "{{colors.scrim.default.hex}}bf"
card = "{{colors.surface_container.default.hex}}f2"
label = "{{colors.on_surface.default.hex}}ff"
empty_label = "{{colors.outline.default.hex}}94"
window_label = "{{colors.on_surface.default.hex}}e6"

# Selection border and move-target marker, matching waybar's accent roles.
selection = "{{colors.primary.default.hex}}e6"
active_window = "{{colors.tertiary.default.hex}}f2"

[behavior]
no_preview = false
switch_on_move = true

# Hover to select, left-click to switch, right-click to move the active window.
allow_mouse = true
